<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halaman Tidak Ditemukan — Pernah di Sini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300&display=swap">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="icon" href="assets/icons/favicon.ico">
<style>
  .nf-wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .nf-eyebrow {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .nf-title {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 26px;
    color: var(--text);
    margin-bottom: 12px;
    line-height: 1.5;
  }
  .nf-sub {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.7;
    max-width: 320px;
    margin-bottom: 8px;
  }
  .nf-line {
    width: 32px;
    height: 1px;
    background: var(--border-gold);
    margin-bottom: 28px;
  }
  /* Versi statis dari .btn-enter — tanpa animasi entrance timed
     (opacity:0 + delay) yang cuma masuk akal untuk reveal sampul */
  .nf-btn {
    margin-top: 20px;
    display: inline-flex; align-items: center; gap: 14px;
    font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 400;
    letter-spacing: 3px; text-transform: uppercase;
    color: var(--gold-dim); text-decoration: none; cursor: pointer;
    background: none; border: none; padding: 0;
    transition: color 0.4s ease; position: relative;
  }
  .nf-btn::before {
    content: ''; position: absolute; bottom: -6px; left: 0; right: 0;
    height: 1px; background: var(--gold-dim);
    transform: scaleX(0); transform-origin: left; transition: transform 0.4s ease;
  }
  .nf-btn:hover { color: var(--gold); }
  .nf-btn:hover::before { transform: scaleX(1); background: var(--gold); }
  .nf-btn .arrow {
    width: 28px; height: 1px; background: currentColor;
    position: relative; transition: width 0.4s ease;
  }
  .nf-btn .arrow::after {
    content: ''; position: absolute; right: 0; top: -3px;
    width: 6px; height: 6px;
    border-right: 1px solid currentColor; border-top: 1px solid currentColor;
    transform: rotate(45deg);
  }
</style>
</head>
<body>
  <div class="nf-wrap">
    <div class="nf-eyebrow">404</div>
    <div class="nf-title">"Halaman ini belum pernah ada di sini."</div>
    <p class="nf-sub">Mungkin tautannya salah ketik, atau halamannya memang belum pernah dibuat.</p>
    <div class="nf-line"></div>
    <a href="index.html" class="nf-btn">
      Kembali ke Sampul
      <span class="arrow"></span>
    </a>
  </div>
</body>
</html>
